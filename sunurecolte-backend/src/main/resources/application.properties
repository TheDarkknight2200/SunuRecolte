# SunuRecolte — application.properties
# Les valeurs sensibles (mot de passe BDD, jwt.secret) sont dans application-local.properties (hors Git)

spring.application.name=sunurecolte-backend
server.port=8080

# --- Base de donnees PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/sunurecolte
spring.datasource.username=postgres
# spring.datasource.password -> defini dans application-local.properties
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Flyway (schema versionne : src/main/resources/db/migration) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JPA / Hibernate ---
# validate : Hibernate ne cree/ne modifie plus le schema, il verifie seulement
# que les entites correspondent aux tables creees par Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Pas de dialecte explicite : Hibernate 6 le detecte depuis la connexion
# (la propriete hibernate.dialect est depreciee, cf. HHH90000025)

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --- Importer la configuration locale (secrets, hors Git) ---
spring.config.import=optional:application-local.properties
