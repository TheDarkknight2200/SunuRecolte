# SunuRecolte — application.properties
# Les valeurs sensibles (mot de passe BDD, jwt.secret) sont dans application-local.properties (hors Git)

spring.application.name=sunurecolte-backend
server.port=8080

# --- Base de donnees PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/sunurecolte
spring.datasource.username=postgres
# spring.datasource.password -> defini dans application-local.properties
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --- Importer la configuration locale (secrets, hors Git) ---
spring.config.import=optional:application-local.properties
