# SunuRecolte — application.properties
# Les valeurs sensibles (mot de passe BDD, jwt.secret) sont dans application-local.properties (hors Git)

spring.application.name=sunurecolte-backend
server.port=8080

# --- Base de donnees PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/sunurecolte
spring.datasource.username=postgres
# spring.datasource.password -> defini dans application-local.properties
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Flyway (schema versionne : src/main/resources/db/migration) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JPA / Hibernate ---
# validate : Hibernate ne cree/ne modifie plus le schema, il verifie seulement
# que les entites correspondent aux tables creees par Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# open-in-view desactive : le chargement paresseux (LAZY) est resolu dans les
# services transactionnels, ou les entites sont converties en DTO.
spring.jpa.open-in-view=false
# Pas de dialecte explicite : Hibernate 6 le detecte depuis la connexion
# (la propriete hibernate.dialect est depreciee, cf. HHH90000025)

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --- JWT (authentification) ---
# Duree de validite d'un jeton, en millisecondes (1 heure).
jwt.expiration=3600000
# jwt.secret n'est JAMAIS declare ici : une valeur versionnee aurait la priorite
# sur application-local.properties (regle de precedence de spring.config.import).
# Le secret vient de la variable d'environnement JWT_SECRET, ou de la ligne
# jwt.secret de application-local.properties (hors Git).

# --- CORS (frontend Angular) ---
# Origines autorisees pour les appels du navigateur, separees par des virgules.
app.cors.origines-autorisees=http://localhost:4200

# --- Compte ADMIN initial (amorcage local, cf. AdminInitializer) ---
# Le compte ADMIN est cree au demarrage si app.admin.email et app.admin.password
# sont renseignes, et s'il n'existe encore aucun utilisateur avec cet email.
# Le mot de passe n'est JAMAIS declare ici : fournir APP_ADMIN_EMAIL et
# APP_ADMIN_PASSWORD par variables d'environnement, ou les lignes app.admin.*
# de application-local.properties (hors Git).
# app.admin.email=
# app.admin.telephone=0000000000

# --- Importer la configuration locale (secrets, hors Git) ---
spring.config.import=optional:application-local.properties
